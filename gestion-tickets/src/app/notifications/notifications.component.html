<div class="notif-header">
  <h3>Vos notifications</h3>
  <button (click)="markAllAsRead()">Tout marquer comme lu</button>
</div>

<div *ngIf="notifications.length; else noNotifs">
  <ul class="notif-list">
    <li *ngFor="let n of notifications"
        [class.unread]="!n.isRead">
      <div class="notif-content" (click)="goTo(n)">
        <strong>{{ n.dateEnvoi | date:'dd/MM/yyyy HH:mm' }}</strong>
        <p>{{ n.message }}</p>
      </div>
        <a *ngIf="n.entityType !== 'Societes'" 
        class="btn btn-link voir-link" 
        (click)="goTo(n)">
        Voir
      </a>
    </li>
  </ul>
</div>

<ng-template #noNotifs>
  <p>Aucune notification pour l’instant.</p>
</ng-template>
